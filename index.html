<title>Guitar Woodshed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: a show-poster rail on the left, one working stage on the right. The only loud colour is the
   seven scale-degree hues, which mean the same thing on every screen. */
:root {
  --bg: #eef1f2; --surface: #fafbfb; --sunk: #e3e8ea; --line: #d2d9de; --line-strong: #98a4ae;
  --fg: #15202b; --muted: #566370; --accent: #d93a22; --accent-ink: #ffffff;
  --board: #2c1d16; --board-lit: #523729; --fret: #b4b8bc; --nut: #ece6d6; --inlay: #e9e2d0; --string: #d9d3c3;
  --ring: #ffffff; --pearl: #ece6d6; --pearl-ink: #1b1410;
  --d1: #dc3d26; --d1-ink: #ffffff; --d2: #f08a24; --d2-ink: #1b1410; --d3: #f2c230; --d3-ink: #1b1410;
  --d4: #4fae6a; --d4-ink: #0d1a12; --d5: #3d8fd1; --d5-ink: #06131f; --d6: #7a5fd0; --d6-ink: #ffffff;
  --d7: #d667a8; --d7-ink: #1b1410; --d0: #c9d1d6; --d0-ink: #15202b;
  --good: #2f9e5b; --bad: #d23b3b;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161d; --surface: #161f29; --sunk: #0a1016; --line: #263340; --line-strong: #5a6a7a;
    --fg: #e9eef2; --muted: #96a4b1; --accent: #ff5a3d; --accent-ink: #160905;
    --board: #261a14; --board-lit: #4a3125; --d0: #2c3a47; --d0-ink: #e9eef2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161d; --surface: #161f29; --sunk: #0a1016; --line: #263340; --line-strong: #5a6a7a;
  --fg: #e9eef2; --muted: #96a4b1; --accent: #ff5a3d; --accent-ink: #160905;
  --board: #261a14; --board-lit: #4a3125; --d0: #2c3a47; --d0-ink: #e9eef2; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--d5); outline-offset: 2px; }
a { color: inherit; }
h1, h2, h3, p, ol, ul { margin: 0; }

.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100dvh; }
.rail { position: sticky; top: 0; align-self: start; height: 100dvh; display: flex; flex-direction: column; gap: 28px;
  padding: 26px 18px 20px max(18px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); }
.brand { display: flex; flex-direction: column; gap: 2px; text-decoration: none; }
.brand-name { font-family: var(--font-display); font-weight: 900; font-size: 38px; line-height: .9; letter-spacing: .01em; text-transform: uppercase; }
.brand-name span { color: var(--accent); }
.brand-tag { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: baseline; justify-content: space-between; padding: 7px 10px; text-decoration: none; border-radius: 3px;
  font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.nav a small { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .04em; opacity: .8; }
.nav a:hover { color: var(--fg); }
.nav a.on { background: var(--fg); color: var(--bg); }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
.rail-foot strong { color: var(--fg); }

.main { width: 100%; max-width: 1060px; margin-inline: auto; padding-block: 34px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (min-width: 861px) { .main { padding-left: max(36px, env(safe-area-inset-left, 0px)); padding-right: max(36px, env(safe-area-inset-right, 0px)); } }
.view { display: flex; flex-direction: column; gap: 30px; }

@media (max-width: 860px) {
  .app { display: block; }
  .rail { position: fixed; inset: auto 0 0 0; height: auto; z-index: 20; flex-direction: row; gap: 0; background: var(--surface);
    border-right: 0; border-top: 1px solid var(--line);
    padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  .rail .brand, .rail-foot { display: none; }
  .nav { flex-direction: row; width: 100%; gap: 0; }
  .nav a { flex: 1; justify-content: center; padding: 9px 0; font-size: 15.5px; letter-spacing: .02em; }
  .nav a small { display: none; }
  .main { padding-block: 18px 96px; }
  .mobile-brand { font-family: var(--font-display); font-weight: 900; font-size: 22px; text-transform: uppercase; line-height: 1; }
  .mobile-brand span { color: var(--accent); }
}

/* Type */
.eyebrow { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 7vw, 64px); line-height: .95; letter-spacing: .005em; text-transform: uppercase; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; letter-spacing: .02em; text-transform: uppercase; text-wrap: balance; }
h3 { font-family: var(--font-body); font-weight: 700; font-size: 17px; line-height: 1.3; }
.lede { font-size: 18px; max-width: 62ch; color: var(--fg); }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.mono { font-family: var(--font-mono); }
.head { display: flex; flex-direction: column; gap: 10px; }
.prose { display: flex; flex-direction: column; gap: 14px; max-width: 66ch; font-size: 17px; }
.prose ol { padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.mono-line { font-family: var(--font-mono); font-size: 14.5px; font-weight: 500; padding: 10px 14px; background: var(--sunk); border-radius: 3px; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.stack.tight { gap: 6px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 980px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.label { font-family: var(--font-mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.rule { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px 8px; border: 1.5px solid var(--fg); border-radius: 3px; background: transparent;
  font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; line-height: 1.1; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--fg); color: var(--bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { border-color: var(--line-strong); color: var(--muted); }
.btn.quiet:hover { background: transparent; color: var(--fg); border-color: var(--fg); }
.btn.sm { padding: 5px 10px 4px; font-size: 14.5px; }
.btn.big { padding: 14px 26px 12px; font-size: 24px; }
.btn-ico { width: 0; height: 0; border-left: 9px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.btn.playing .btn-ico { width: 10px; height: 10px; border: 0; background: currentColor; }
.btn[disabled] { opacity: .45; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-width: 38px; padding: 6px 11px 5px; border: 1px solid var(--line-strong); border-radius: 999px; background: transparent; font-size: 14px; font-weight: 600; line-height: 1.2; }
.chip:hover { border-color: var(--fg); }
.chip.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
.chip.right { background: var(--good); border-color: var(--good); color: #fff; }
.chip.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }
input[type="range"] { width: 100%; max-width: 260px; accent-color: var(--accent); }
input[type="text"], textarea, select { width: 100%; padding: 9px 11px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 3px; }
textarea { font-family: var(--font-mono); font-size: 14.5px; min-height: 108px; resize: vertical; }
select { width: auto; padding: 6px 9px; }
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 2px solid var(--fg); }
.tab { padding: 9px 16px 7px; border: 0; background: transparent; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.tab.on { background: var(--fg); color: var(--bg); }
.check { display: flex; gap: 11px; align-items: flex-start; cursor: pointer; }
.check input { width: 19px; height: 19px; margin: 3px 0 0; accent-color: var(--accent); flex: none; }
.check.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel.sunk { background: var(--sunk); border-color: transparent; }
.note { font-size: 14.5px; color: var(--muted); max-width: 66ch; }
.tag { display: inline-block; padding: 1px 7px; border: 1px solid var(--line-strong); border-radius: 2px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); vertical-align: middle; }

/* Degree colours */
.deg { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; padding: 2px 7px 1px; border-radius: 2px; font-family: var(--font-display); font-weight: 800; font-size: 16px; letter-spacing: .03em; line-height: 1.15; background: var(--d0); color: var(--d0-ink); }
.d1 { background: var(--d1); color: var(--d1-ink); } .d2 { background: var(--d2); color: var(--d2-ink); } .d3 { background: var(--d3); color: var(--d3-ink); }
.d4 { background: var(--d4); color: var(--d4-ink); } .d5 { background: var(--d5); color: var(--d5-ink); } .d6 { background: var(--d6); color: var(--d6-ink); } .d7 { background: var(--d7); color: var(--d7-ink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; }
.legend span.pair { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }

/* Chord tiles */
.tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 62px; padding: 10px 10px 9px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; position: relative; }
.tile:hover { border-color: var(--fg); }
.tile.now { border-color: var(--fg); box-shadow: 0 0 0 2px var(--fg); }
.tile-name { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1; }
.tile-sub { font-size: 11.5px; color: var(--muted); line-height: 1.2; text-align: center; }
.tile .cbox { width: 86px; }
.tile.new { border-style: dashed; border-color: var(--line-strong); }
.tile.mini { min-width: 50px; padding: 7px 8px 6px; }
.tile.mini .tile-name { font-size: 21px; }
.tile.mini .deg { font-size: 13.5px; min-width: 24px; padding: 1px 5px 0; }
.cbox { display: block; width: 104px; height: auto; }
.cbox-x { font-size: 9px; fill: var(--muted); font-family: var(--font-mono); }
.cbox-fr { font-size: 8.5px; fill: var(--muted); font-family: var(--font-mono); }
.cbox-l { font-size: 6.2px; font-weight: 700; font-family: var(--font-body); }

/* Fretboard */
.fb-wrap { overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.fb { display: block; width: 100%; height: auto; }
.fb-num { font-family: var(--font-mono); font-size: 10.5px; fill: var(--muted); opacity: .6; }
.fb-num.key { fill: var(--fg); opacity: 1; font-weight: 600; }
.fb-open { font-family: var(--font-mono); font-size: 11px; fill: var(--muted); }
.fb-label { font-family: var(--font-body); font-size: 10.5px; font-weight: 700; pointer-events: none; }
.fb-hit { cursor: pointer; }
.fb-hit:hover { fill: rgba(255, 255, 255, .14); }
.fb-mark { pointer-events: none; }

/* Strum grid */
.strum { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; max-width: 520px; }
.strum-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 8px; border-radius: 3px; background: var(--sunk); }
.strum-arrow { font-family: var(--font-display); font-weight: 900; font-size: 34px; line-height: 1; opacity: .16; }
.strum-cell.hit .strum-arrow { opacity: 1; }
.strum-count { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.strum-cell.beat .strum-count { color: var(--fg); font-weight: 600; }
.strum-cell.now { background: var(--fg); color: var(--bg); }
.strum-cell.now .strum-count { color: var(--bg); }

/* Today */
.session { display: flex; flex-direction: column; }
.block { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 16px; align-items: start; padding: 18px 0; border-top: 1px solid var(--line); }
.block:last-child { border-bottom: 1px solid var(--line); }
.block-time { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: .9; }
.block-time small { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
.block-time span { font-size: 15px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; margin-left: 3px; }
.block.done .block-time, .block.done h3 { color: var(--muted); }
.block.done h3 { text-decoration: line-through; text-decoration-color: var(--line-strong); }
.block-side { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
@media (max-width: 560px) { .block { grid-template-columns: 54px minmax(0, 1fr); } .block-side { grid-column: 2; flex-direction: row; flex-wrap: wrap; align-items: center; } .block-time { font-size: 32px; } }
.dots { display: grid; grid-template-columns: repeat(7, 16px); gap: 5px; }
.dot { width: 16px; height: 16px; border-radius: 2px; background: var(--d0); }
.dot.on { background: var(--accent); }
.dot.today { outline: 2px solid var(--fg); outline-offset: 1px; }
.stat-n { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: .9; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.bar { height: 6px; background: var(--d0); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg); }
.stage-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 14px; text-decoration: none; }
.stage-row b { font-family: var(--font-display); font-weight: 800; font-size: 19px; }
button.stage-row { width: 100%; padding: 6px 0 0; border: 0; border-top: 1px dashed var(--line-strong); background: none; text-align: left; }
button.stage-row b { color: var(--accent); }
button.stage-row:hover span { text-decoration: underline; }
.stage-row .bar { grid-column: 2; }

/* Path */
.stage { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px 20px; padding: 24px 0; border-top: 2px solid var(--fg); }
.stage-n { font-family: var(--font-display); font-weight: 900; font-size: 84px; line-height: .78; color: var(--fg); }
.stage.done-all .stage-n { color: var(--muted); }
@media (max-width: 560px) { .stage { grid-template-columns: minmax(0, 1fr); } .stage-n { font-size: 52px; } }
.lessons { display: flex; flex-direction: column; margin-top: 6px; }
.lesson-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 10px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; font-size: 16.5px; font-weight: 600; }
.lesson-row:hover { background: var(--surface); }
.lesson-row .tick { width: 18px; height: 18px; border: 1.5px solid var(--line-strong); border-radius: 50%; }
.lesson-row.done .tick { background: var(--good); border-color: var(--good); box-shadow: inset 0 0 0 3px var(--bg); }
.lesson-row.next .tick { border-color: var(--accent); border-width: 3px; }
.lesson-row .mins { font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--muted); }
.quiz-q { display: flex; flex-direction: column; gap: 9px; }
.quiz-opts { display: flex; flex-wrap: wrap; gap: 7px; }
.opt { padding: 8px 14px; border: 1px solid var(--line-strong); border-radius: 3px; background: var(--surface); font-weight: 600; font-size: 15px; text-align: left; }
.opt:hover { border-color: var(--fg); }
.opt.right { background: var(--good); border-color: var(--good); color: #fff; }
.opt.wrong { background: var(--bad); border-color: var(--bad); color: #fff; }

/* Songs */
.song { display: flex; flex-direction: column; gap: 14px; padding: 22px 0; border-top: 2px solid var(--fg); }
.song-title { font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1; text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }
.song-line { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; align-items: center; }
@media (max-width: 560px) { .song-line { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.hist { display: grid; grid-template-columns: 44px minmax(0, 1fr) 28px; gap: 8px; align-items: center; font-size: 13px; }
.hist .bar { height: 12px; border-radius: 2px; }

/* Jam */
.now-chord { font-family: var(--font-display); font-weight: 900; font-size: clamp(72px, 16vw, 132px); line-height: .82; }
.beats { display: flex; gap: 6px; }
.beats i { width: 14px; height: 14px; border-radius: 50%; background: var(--d0); }
.beats i.now { background: var(--accent); }
.transport { display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: flex-end; }
.bigq { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 46px); line-height: 1; text-transform: uppercase; text-wrap: balance; }
.score { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .tile, .chip, .btn, .strum-cell { transition: background-color .08s, border-color .08s, color .08s; } }

/* Secondary links, glossary, guide, targets, tuner */
.nav2 { display: flex; flex-direction: column; gap: 2px; margin-top: -14px; padding-top: 12px; border-top: 1px solid var(--line); }
.nav2 a { padding: 5px 10px; border-radius: 3px; font-size: 14px; font-weight: 600; text-decoration: none; color: var(--muted); }
.nav2 a:hover { color: var(--fg); }
.nav2 a.on { background: var(--fg); color: var(--bg); }
.mobile-top { display: none; }
@media (max-width: 860px) {
  .rail .nav2 { display: none; }
  .mobile-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mobile-brand { text-decoration: none; }
  .mobile-links { display: flex; gap: 6px; }
  .mobile-links a { padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 999px; font-size: 13px; font-weight: 600; text-decoration: none; }
  .mobile-links a.on { background: var(--fg); border-color: var(--fg); color: var(--bg); }
}
button.term { padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: help; text-decoration: underline dotted var(--line-strong); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
button.term:hover { text-decoration-color: var(--accent); }
.gloss { position: absolute; z-index: 30; width: max-content; max-width: min(340px, calc(100vw - 24px)); padding: 13px 16px 14px; background: var(--fg); color: var(--bg); border-radius: 4px; font-size: 14.5px; line-height: 1.45; box-shadow: 0 8px 28px rgba(0, 0, 0, .28); }
.gloss strong { display: block; margin-bottom: 3px; font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; }
.gloss.sheet { position: fixed; width: auto; max-width: none; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); }
.points { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 9px; max-width: 66ch; }
